spring:
  datasource:
    url: jdbc:h2:mem:heatbudget-demo;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  flyway:
    enabled: false
  jpa:
    hibernate:
      ddl-auto: create-drop
  data:
    redis:
      repositories:
        enabled: false

management:
  health:
    redis:
      enabled: false

server:
  port: ${SERVER_PORT:9090}
